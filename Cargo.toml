[workspace]
members = [
    "wireforge-core",
    "wireforge-packet",
    "wireforge-io",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wireforge/wireforge"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
