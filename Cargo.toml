[workspace]
members = [
    "wireforge-core",
    "wireforge-packet",
    "wireforge-io",
    "wireforge-app",
]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/alazycat/wireforge"
documentation = "https://docs.rs/wireforge-core"
readme = "../README.md"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
