[package]
name = "wireforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Application-layer protocol parsers/builders and pcap file I/O"

[features]
# Optional deep parsing: bridges pcap records through wireforge-packet's
# link/network/transport dispatch into the application-layer parsers.
dispatch = ["dep:wireforge-packet"]

[dependencies]
wireforge-core = { version = "1.2.0", path = "../wireforge-core" }
wireforge-packet = { version = "1.2.0", path = "../wireforge-packet", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dns_parse_bench"
harness = false

[[bench]]
name = "pcap_read_bench"
harness = false
