name: CI

on: [push, pull_request]

jobs:
  build-and-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo doc --no-deps --workspace

  linux-privileged-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run privileged Linux I/O tests
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            cargo test --workspace -- --ignored --test-threads=1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Mutation harness smoke (stable semantics)
        run: cargo run --release --manifest-path fuzz/Cargo.toml -- --iters 200000 --seed 1234
      - name: Build libFuzzer targets
        working-directory: fuzz
        run: cargo fuzz build --features libfuzzer
      - name: libFuzzer smoke (30s per target)
        working-directory: fuzz
        run: |
          for t in ipv4 ipv6 tcp udp l2 tunnels icmp_igmp dns app_dispatch; do
            echo "=== fuzz: $t ==="
            cargo fuzz run "$t" --features libfuzzer -- -max_total_time=30 -rss_limit_mb=4096
          done

# macOS privileged I/O tests are disabled until #3/#4 implement BPF/L3.
# Windows Npcap tests require the Npcap driver; the free Npcap installer does
# not support silent installation, so GitHub-hosted runners cannot run them.
# Run locally with: cargo test -p wireforge-io npcap -- --ignored
