[package]
name = "wireforge-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Cross-platform raw socket I/O — AF_PACKET/BPF/NPcap L2 and raw socket L3"

[features]
default = []
npcap = []
# Serde support for Interface / IpNetwork; forwards to wireforge-core's serde.
serde = ["dep:serde", "wireforge-core/serde"]

[dependencies]
wireforge-core = { version = "1.2.0", path = "../wireforge-core" }
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
